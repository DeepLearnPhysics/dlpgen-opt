# Copy and customize allocation, filesystem, module and resource settings.
# See docs/schedulers.md. These CPU profiles use one node per array element.
profiles:
  s3df_milano:
    account: neutrino:ml-dev
    partition: milano
    cpus_per_task: 1
    mem_per_cpu: 4G
    time: "02:00:00"
    max_array_size: 99
    bind_paths:
      - /sdf

  s3df_roma:
    account: neutrino:ml-dev
    partition: roma
    cpus_per_task: 1
    mem_per_cpu: 4G
    time: "02:00:00"
    max_array_size: 99
    bind_paths:
      - /sdf

  aurora:
    scheduler: pbs
    account: neutrinoGPU::debug_aurora
    queue: capacity
    system: aurora
    node_cpus: 102
    cpu_bind: list:1-51,53-103
    prepare_jobs_per_task: 12
    filesystems: home:flare
    container_runtime: apptainer
    modules: [apptainer]
    cpus_per_task: 102
    prepare_cpus_per_task: 102
    jobs_per_task: 102
    time: '02:00:00'
    max_array_size: 100
    max_concurrent: 2
    bind_paths: []
  polaris:
    scheduler: pbs
    account: neutrinoGPU::SpineDev
    queue: capacity
    system: polaris
    node_cpus: 32
    cpu_bind: list:0-31
    prepare_jobs_per_task: 4
    filesystems: home:eagle
    container_runtime: apptainer
    module_paths: [/soft/modulefiles]
    modules: [spack-pe-base, apptainer]
    cpus_per_task: 32
    prepare_cpus_per_task: 32
    jobs_per_task: 32
    time: '02:00:00'
    max_array_size: 100
    max_concurrent: 2
    bind_paths: []
  nersc_cpu:
    scheduler: slurm
    account: REPLACE_WITH_PROJECT
    qos: regular
    constraint: cpu
    container_runtime: shifter
    use_srun: true
    shifter_modules: none
    cpus_per_task: 32
    prepare_cpus_per_task: 32
    jobs_per_task: 32
    mem_per_cpu: null
    time: '02:00:00'
    max_array_size: 100
    bind_paths: []
