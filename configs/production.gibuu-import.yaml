schema_version: 1

production:
  name: gibuu_import_v001
  output_dir: ../runs/gibuu_import_v001
  jobs: 1
  generator_calls_per_job: 10
  base_seed: 104741
  seed_stride: 10

# This supported mode consumes an existing GiBUU 2025 native NuHepMC vector.
source:
  type: gibuu
  config: gibuu/nuhepmc-import.yaml
  input: ../inputs/gibuu/events.hepmc3
  jobcard: ../inputs/gibuu/jobcard.nml

software:
  container_image: dlpgen-opt:0.3.0
  edep_sim:
    executable: edep-sim
    expected_commit: 4548701be5bd82daae65c9f1e51f63b1886b71d9
  edep2supera:
    executable: dlpgen-opt-supera
    expected_commit: da89c94cfcce10c39b994df5e7ca5dffa067ea6c
  supera_atomic:
    expected_commit: 426408371d0a4bb20495cffabc0a8539df6fdae4

detector:
  geometry: geometry/lar_vat.gdml
  supera_config: supera/lar_sbn.yaml
  physics_list: QGSP_BERT

execution:
  resume: true
