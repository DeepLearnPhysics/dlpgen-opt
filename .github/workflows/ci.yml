name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and tests
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'

      - name: Check installed dependencies
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Validate packaged production configurations
        run: |
          python - <<'PY'
          from pathlib import Path
          from dlpgen_opt.config import load_config

          paths = sorted(Path("configs").glob("production*.yaml"))
          assert paths, "no packaged production configurations found"
          for path in paths:
              load_config(path)
              print(path)
          PY

      - name: Run unit tests
        run: python -m pytest
